name: deploy-detections

# Detection-as-Code pipeline:
#   pull_request -> validate detection files
#   push to main -> deploy to Azure Sentinel when Azure is configured

on:
  pull_request:

  push:
    branches: [main]
    paths:
      - "detections/rules/**"
      - "cicd/**"

permissions:
  contents: read

env:
  SENTINEL_RESOURCE_GROUP: sc200-lab
  SENTINEL_WORKSPACE: sc200-ws

jobs:

  # ------------------------------------------------------------
  # Pull Request validation
  # ------------------------------------------------------------
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate detection rules
        run: python cicd/validate-detections.py


  # ------------------------------------------------------------
  # Real Azure deployment
  # ------------------------------------------------------------
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: sentinel-prod

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy rules to Sentinel
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: python cicd/deploy-detections.py
